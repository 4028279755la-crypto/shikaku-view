<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <!-- 背景: 救済オレンジ (D-8 系統色) を継承 -->
  <rect width="192" height="192" rx="34" fill="#FF6B47"/>

  <!-- カレンダー本体 -->
  <rect x="28" y="44" width="136" height="120" rx="12" fill="#FFFFFF"/>

  <!-- カレンダーヘッダー帯 -->
  <rect x="28" y="44" width="136" height="22" rx="12" fill="#E55A3A"/>
  <rect x="28" y="60" width="136" height="6" fill="#E55A3A"/>

  <!-- リング（カレンダーの綴じ） -->
  <rect x="56" y="30" width="6" height="26" rx="3" fill="#3A3A3A"/>
  <rect x="130" y="30" width="6" height="26" rx="3" fill="#3A3A3A"/>

  <!-- 日付グリッド（4x3） -->
  <g fill="#FFCFC0">
    <rect x="40"  y="78"  width="22" height="14" rx="3"/>
    <rect x="68"  y="78"  width="22" height="14" rx="3"/>
    <rect x="96"  y="78"  width="22" height="14" rx="3"/>
    <rect x="124" y="78"  width="22" height="14" rx="3"/>
    <rect x="40"  y="98"  width="22" height="14" rx="3"/>
    <rect x="68"  y="98"  width="22" height="14" rx="3"/>
    <rect x="124" y="98"  width="22" height="14" rx="3"/>
    <rect x="40"  y="118" width="22" height="14" rx="3"/>
    <rect x="96"  y="118" width="22" height="14" rx="3"/>
    <rect x="124" y="118" width="22" height="14" rx="3"/>
    <rect x="40"  y="138" width="22" height="14" rx="3"/>
    <rect x="68"  y="138" width="22" height="14" rx="3"/>
    <rect x="96"  y="138" width="22" height="14" rx="3"/>
  </g>

  <!-- 試験日マーカー（強調セル） -->
  <rect x="96"  y="98"  width="22" height="14" rx="3" fill="#FF6B47"/>
  <rect x="68"  y="118" width="22" height="14" rx="3" fill="#5DB378"/>

  <!-- 申込期間バー（カレンダー外・下部） -->
  <rect x="40" y="78" width="106" height="14" rx="3" fill="none" stroke="#3DB0E0" stroke-width="2.5" stroke-dasharray="3,2"/>
</svg>
